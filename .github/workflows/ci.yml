name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            infra/docker/caddy/go.sum
      - run: make check-generated test integration check-config vuln
      - run: make images
      - name: Validate Caddy with dropped privileges
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e SITE_ADDRESS=threat.local -e 'TLS_DIRECTIVE=tls internal' \
            -v "$PWD/infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --tmpfs /data:uid=10003,gid=10003,mode=0700 \
            --tmpfs /config:uid=10003,gid=10003,mode=0700 \
            threat-caddy:local validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: threat-postgres:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
