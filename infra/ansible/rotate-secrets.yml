---
- name: Rotate service secrets with a controlled maintenance window
  hosts: threat
  become: true
  gather_facts: false
  tasks:
    - name: Require a prepared encrypted secret document
      ansible.builtin.assert:
        that: [secrets_file is defined]
    - name: Stage the encrypted candidate
      ansible.builtin.copy:
        src: '{{ secrets_file }}'
        dest: /etc/threat-service/secrets.next.enc.json
        mode: '0600'
      no_log: true
    - name: Validate before stopping the application
      ansible.builtin.command: /usr/local/libexec/threat/validate-rotation.py
      changed_when: false
    - name: Stop all service containers before replacing bind-mounted files
      ansible.builtin.command: /usr/local/libexec/threat/stack.py stop
      changed_when: true
    - name: Activate validated ciphertext
      ansible.builtin.copy:
        src: /etc/threat-service/secrets.next.enc.json
        remote_src: true
        dest: /etc/threat-service/secrets.enc.json
        mode: '0600'
      no_log: true
    - name: Materialize new files in tmpfs
      ansible.builtin.systemd_service:
        name: threat-secrets.service
        state: restarted
    - name: Start only PostgreSQL with recreated secret mounts
      ansible.builtin.command: /usr/local/libexec/threat/stack.py database
      changed_when: true
    - name: Rotate database roles over the local peer-authenticated socket
      ansible.builtin.command: /usr/local/libexec/threat/rotate-db-passwords.py
      no_log: true
      changed_when: true
    - name: Recreate the application with new secret files
      ansible.builtin.command: /usr/local/libexec/threat/stack.py recreate
      changed_when: true
